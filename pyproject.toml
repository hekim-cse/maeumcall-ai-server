[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".venv",
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
