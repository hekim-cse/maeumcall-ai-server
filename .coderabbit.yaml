# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "ko-KR"
tone_instructions: "문제의 영향과 재현 조건을 초보자도 이해할 수 있는 구체적인 한국어로 설명하세요."
early_access: false
enable_free_tier: true

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: true
  review_progress: true
  fail_commit_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"

  path_instructions:
    - path: "services/**/*.py"
      instructions: |
        운영 경로와 도메인 계약을 우선 검토하세요.
        상태 전이, 허용 행동, 필수 필드, 선택형 필드 코드, 오류 경계를 확인하세요.
        임시 fallback, 휴리스틱 보정, 오류 은폐가 추가되면 지적하세요.

    - path: "llm/**/*.py"
      instructions: |
        모델 출력의 구조 검증, 재시도 경계, 로컬 모델 코드 실행 여부를 검토하세요.
        모델이 만든 값을 신뢰하기 전에 운영 계약으로 검증하는지 확인하세요.

    - path: "evals/**/*.py"
      instructions: |
        평가 계약이 실제 운영 validator보다 느슨하지 않은지 검토하세요.
        실패한 예측이 의미 지표를 유리하게 만들지 않는지 확인하세요.
        공식 데이터 범위, 재현 metadata, micro와 macro 집계가 주장과 일치하는지 확인하세요.

    - path: "tests/**/*.py"
      instructions: |
        정상 사례뿐 아니라 잘못된 enum, 알 수 없는 필드, 공백 값, 재시도 실패를 검증하는지 확인하세요.
        테스트가 구현을 그대로 반복하지 않고 사용자에게 보이는 계약을 검증하는지 확인하세요.

    - path: "alembic/**/*.py"
      instructions: |
        upgrade와 downgrade의 대칭성, 데이터 손실 가능성, 트랜잭션 경계를 검토하세요.
        운영 중인 PostgreSQL에서 안전하게 실행할 수 있는지 확인하세요.

    - path: "**/*.md"
      instructions: |
        현재 구현, 검증 결과, 향후 계획을 구분하세요.
        코드와 테스트로 증명되지 않은 완료 표현이나 오래된 테스트 수치를 지적하세요.

chat:
  auto_reply: true
