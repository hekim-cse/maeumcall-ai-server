services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: maeumcall
      POSTGRES_USER: maeumcall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - maeumcall_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maeumcall -d maeumcall"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  maeumcall_postgres_data:
