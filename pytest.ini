[pytest]
testpaths = tests
addopts = -m "not integration"
pythonpath = .
filterwarnings =
    ignore:The default value of `allowed_objects` will change:langchain_core._api.deprecation.LangChainPendingDeprecationWarning
markers =
    unit: pure unit tests
    graph_flow: langgraph state flow tests
    integration: tests requiring an external runtime
    postgres: real PostgreSQL repository integration tests
