apiVersion: batch/v1
kind: Job
metadata:
  name: maeumcall-migrate
  namespace: maeumcall-lab
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: migrate
          image: maeum-call-ai-server:2.2.0-core
          imagePullPolicy: Never
          command: [alembic, upgrade, head]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: maeumcall-lab
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp/maeumcall
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
